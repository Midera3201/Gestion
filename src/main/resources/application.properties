# =====================================================================
#  Configuration Spring Boot
#  Fichier : src/main/resources/application.properties
# =====================================================================

spring.application.name=sirh

# --- Serveur web -----------------------------------------------------
# Le site sera accessible sur http://localhost:4200
# (8080 etait deja utilise par un autre programme sur ce PC)
server.port=4200

# --- Connexion PostgreSQL --------------------------------------------
# Base "rh", utilisateur "rh", mot de passe "rh" (creation locale).
# En vrai projet, le mot de passe ne doit pas etre ecrit ici :
# on utilise une variable d'environnement. On le garde pour simplifier.
spring.datasource.url=jdbc:postgresql://localhost:5432/rh
spring.datasource.username=rh
spring.datasource.password=rh
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------
# none = Hibernate ne touche JAMAIS aux tables.
# C'est nous qui creons le schema avec sql/01_schema.sql.
# Ne jamais mettre "create" ou "create-drop" ici : cela effacerait les donnees.
spring.jpa.hibernate.ddl-auto=none

# Affiche le SQL genere dans la console : tres utile pour comprendre
# et pour la soutenance.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# open-in-view=false : la connexion a la base est fermee des que la
# requete est terminee. Evite les mauvaises surprises.
spring.jpa.open-in-view=false

# --- Thymeleaf -------------------------------------------------------
# cache=false : on voit nos modifications HTML sans redemarrer.
# A passer a true en production.
spring.thymeleaf.cache=false

# --- Logs ------------------------------------------------------------
# Affiche les requetes SQL avec leurs parametres (debug).
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
