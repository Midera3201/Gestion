<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre}">SIRH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- ================= MENU commun a toutes les pages ================= -->
<!-- sec:authorize montre un element seulement si le role connecte a le droit.
     Ce n'est qu'un confort visuel : la vraie protection est dans
     SecurityConfig (cote serveur). -->
<nav th:fragment="menu" class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">SIRH</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}">Tableau de bord</a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('MANAGER','RH','FINANCE','DIRECTION','ADMIN')">
                    <a class="nav-link" th:href="@{/demandes}">Demandes</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RH','ADMIN')">
                    <a class="nav-link" th:href="@{/postes}">Postes</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RH','ADMIN')">
                    <a class="nav-link" th:href="@{/offres}">Offres</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RH','ADMIN')">
                    <a class="nav-link" th:href="@{/candidatures}">Candidatures</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RH','MANAGER','ADMIN')">
                    <a class="nav-link" th:href="@{/entretiens}">Entretiens</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('DIRECTION')">
                    <a class="nav-link" th:href="@{/decisions}">Decisions</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RH','ADMIN')">
                    <a class="nav-link" th:href="@{/employes}">Employes</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RH','ADMIN')">
                    <a class="nav-link" th:href="@{/departements}">Departements</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/utilisateurs}">Utilisateurs</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/historique}">Historique</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/carrieres}" target="_blank">Carrieres (public)</a>
                </li>
            </ul>

            <span class="navbar-text me-3">
                <span sec:authentication="name">utilisateur</span>
                <span class="badge bg-light text-dark ms-1" sec:authentication="principal.codeRole">ROLE</span>
            </span>

            <!-- Deconnexion : un formulaire POST, car la deconnexion ne doit
                 pas se faire par un simple lien GET. -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Deconnexion</button>
            </form>
        </div>
    </div>
</nav>

<!-- ================= Messages de succes / d'erreur ================= -->
<div th:fragment="messages">
    <div class="alert alert-success" th:if="${message}" th:text="${message}">
        Operation reussie.
    </div>
    <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}">
        Operation refusee.
    </div>
</div>

</body>
</html>
