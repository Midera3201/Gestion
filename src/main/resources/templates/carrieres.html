<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrieres - SIRH</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/carrieres">Carrieres - Ecole</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/login">Espace employes</a></li>
        </ul>
    </div>
</nav>

<main class="container py-4">

    <div th:replace="~{fragments/layout :: messages}"></div>

    <div class="text-center mb-5">
        <h1 class="h3">Les offres d'emploi de l'ecole</h1>
        <p class="text-muted">Postulez en ligne : une candidature, une lettre, un entretien.</p>
    </div>

    <div class="row g-4">
        <div class="col-md-6" th:each="o : ${offres}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h2 class="h5" th:text="${o.titreOffre}">Responsable marketing</h2>
                    <p class="text-muted small">
                        <span th:text="${o.typeContrat}">CDI</span>
                        - <span th:text="${o.lieuOffre}">Paris</span>
                    </p>
                    <p th:text="${o.descriptionOffre}">Description</p>
                </div>
                <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                    <span class="small text-muted"
                          th:text="${o.dateCloture != null} ? ('Cloture le ' + ${@affichage.date(o.dateCloture)}) : 'Cloture a preciser'">
                        Cloture
                    </span>
                    <a th:href="@{/carrieres/{id}(id=${o.idOffre})}" class="btn btn-primary btn-sm">
                        Postuler
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-light border text-center mt-4" th:if="${#lists.isEmpty(offres)}">
        Aucune offre n'est publiee pour le moment.
    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
