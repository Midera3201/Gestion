<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Postes')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">

    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-4">Les postes</h1>

    <div class="row g-4">

        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header">Les postes de l'ecole</div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Titre</th>
                            <th>Departement</th>
                            <th class="text-end">Salaire min</th>
                            <th class="text-end">Salaire max</th>
                            <th>Etat</th>
                            <th class="text-end">Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${postes}">
                            <td th:text="${p.idPoste}">1</td>
                            <td>
                                <strong th:text="${p.titrePoste}">Developpeur Java</strong>
                                <div class="small text-muted" th:text="${p.descriptionPoste}">-</div>
                            </td>
                            <td th:text="${p.departement.nomDepartement}">Informatique</td>
                            <td class="text-end" th:text="${@affichage.argent(p.salaireMin)}">-</td>
                            <td class="text-end" th:text="${@affichage.argent(p.salaireMax)}">-</td>
                            <td>
                                <span class="badge" th:classappend="${p.actif} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${p.actif} ? 'ACTIF' : 'DESACTIVE'">ACTIF</span>
                            </td>
                            <td class="text-end">
                                <form th:action="@{/postes/{id}/basculer(id=${p.idPoste})}" method="post">
                                    <button type="submit" class="btn btn-outline-secondary btn-sm"
                                            th:text="${p.actif} ? 'Desactiver' : 'Reactiver'">Desactiver</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(postes)}">
                            <td colspan="7" class="text-center text-muted">Aucun poste.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header">Nouveau poste</div>
                <div class="card-body">
                    <form th:action="@{/postes/nouveau}" method="post">

                        <div class="mb-3">
                            <label for="titrePoste" class="form-label">Titre du poste *</label>
                            <input type="text" class="form-control" id="titrePoste" name="titrePoste" required>
                        </div>

                        <div class="mb-3">
                            <label for="descriptionPoste" class="form-label">Description</label>
                            <textarea class="form-control" id="descriptionPoste" name="descriptionPoste" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="idDepartement" class="form-label">Departement *</label>
                            <select class="form-select" id="idDepartement" name="idDepartement" required>
                                <option value="">-- Choisir --</option>
                                <option th:each="d : ${departements}"
                                        th:value="${d.idDepartement}"
                                        th:text="${d.nomDepartement}">Informatique</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="salaireMin" class="form-label">Salaire min</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="salaireMin" name="salaireMin">
                            </div>
                            <div class="col-6 mb-3">
                                <label for="salaireMax" class="form-label">Salaire max</label>
                                <input type="number" step="0.01" min="0" class="form-control"
                                       id="salaireMax" name="salaireMax">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Creer le poste</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
