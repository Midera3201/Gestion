<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detail de l entretien')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">

    <div th:replace="~{fragments/layout :: messages}"></div>

    <a th:href="@{/entretiens}" class="btn btn-outline-secondary btn-sm mb-3">&lt; Retour aux entretiens</a>

    <div class="row g-4">

        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span th:text="${entretien.candidature.candidat.prenomCandidat} + ' ' + ${entretien.candidature.candidat.nomCandidat}">
                        Candidat
                    </span>
                    <span class="badge" th:classappend="${@affichage.badge(entretien.statutEntretien)}"
                          th:text="${@affichage.libelle(entretien.statutEntretien)}">Planifie</span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-3">Date</dt>
                        <dd class="col-sm-9" th:text="${@affichage.dateHeure(entretien.dateHeureEntretien)}">-</dd>
                        <dt class="col-sm-3">Type</dt>
                        <dd class="col-sm-9" th:text="${entretien.typeEntretien}">-</dd>
                        <dt class="col-sm-3">Lieu</dt>
                        <dd class="col-sm-9" th:text="${entretien.lieuEntretien}">-</dd>
                        <dt class="col-sm-3">Offre</dt>
                        <dd class="col-sm-9" th:text="${entretien.candidature.offre.titreOffre}">-</dd>
                    </dl>
                </div>
            </div>

            <div class="card mt-4 shadow-sm">
                <div class="card-header">Les avis deja donnes</div>
                <div class="card-body">
                    <div th:each="e : ${evaluations}" class="border rounded p-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong th:text="${e.evaluateur.nomComplet}">Sophie Bernard</strong>
                            <span>
                                <span class="badge bg-dark" th:text="${e.noteEvaluation}">4</span>
                                <span class="badge" th:classappend="${@affichage.badge(e.avisEvaluation)}"
                                      th:text="${@affichage.libelle(e.avisEvaluation)}">Favorable</span>
                            </span>
                        </div>
                        <div class="small mt-2">
                            <div><strong>Points forts :</strong> <span th:text="${e.pointsForts}">-</span></div>
                            <div><strong>Points faibles :</strong> <span th:text="${e.pointsFaibles}">-</span></div>
                        </div>
                        <div class="small text-muted mt-1"
                             th:text="${@affichage.dateHeure(e.dateEvaluation)}">01/01/2026</div>
                    </div>
                    <p class="text-muted mb-0" th:if="${#lists.isEmpty(evaluations)}">
                        Aucun avis n'a encore ete donne sur cet entretien.
                    </p>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header">Donner mon avis</div>
                <div class="card-body">
                    <form th:action="@{/entretiens/{id}/evaluation(id=${entretien.idEntretien})}" method="post">

                        <div class="mb-3">
                            <label for="noteEvaluation" class="form-label">Note (de 1 a 5) *</label>
                            <select class="form-select" id="noteEvaluation" name="noteEvaluation" required>
                                <option value="">-- Choisir --</option>
                                <option value="5">5 - Excellent</option>
                                <option value="4">4 - Tres bon</option>
                                <option value="3">3 - Correct</option>
                                <option value="2">2 - Insuffisant</option>
                                <option value="1">1 - Eliminaire</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="avisEvaluation" class="form-label">Avis *</label>
                            <select class="form-select" id="avisEvaluation" name="avisEvaluation" required>
                                <option value="FAVORABLE">Favorable</option>
                                <option value="RESERVE">Reserve</option>
                                <option value="DEFAVORABLE">Defavorable</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="pointsForts" class="form-label">Points forts</label>
                            <textarea class="form-control" id="pointsForts" name="pointsForts" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="pointsFaibles" class="form-label">Points faibles</label>
                            <textarea class="form-control" id="pointsFaibles" name="pointsFaibles" rows="2"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Enregistrer mon avis</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
