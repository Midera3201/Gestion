<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Administration des utilisateurs')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">

    <div th:replace="~{fragments/layout :: messages}"></div>

    <h1 class="h3 mb-4">Comptes utilisateurs et roles</h1>

    <div class="card shadow-sm">
        <div class="card-header">Comptes</div>
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Etat</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${utilisateurs}">
                    <td th:text="${u.idUtilisateur}">1</td>
                    <td th:text="${u.nomComplet}">Alice Dupont</td>
                    <td th:text="${u.emailUtilisateur}">admin@ecole.fr</td>

                    <!-- Changer le role : un formulaire par ligne -->
                    <td>
                        <form th:action="@{'/admin/utilisateurs/' + ${u.idUtilisateur} + '/role'}"
                              method="post" class="d-flex gap-1">
                            <select name="idRole" class="form-select form-select-sm">
                                <option th:each="r : ${roles}"
                                        th:value="${r.idRole}"
                                        th:text="${r.codeRole}"
                                        th:selected="${r.idRole == u.role.idRole}">RH</option>
                            </select>
                            <button type="submit" class="btn btn-outline-primary btn-sm">OK</button>
                        </form>
                    </td>

                    <td>
                        <span class="badge" th:classappend="${u.actif} ? 'bg-success' : 'bg-secondary'"
                              th:text="${u.actif} ? 'ACTIF' : 'DESACTIVE'">ACTIF</span>
                    </td>

                    <td class="text-end">
                        <form th:action="@{'/admin/utilisateurs/' + ${u.idUtilisateur} + '/basculer'}"
                              method="post">
                            <button type="submit" class="btn btn-outline-secondary btn-sm"
                                    th:text="${u.actif} ? 'Desactiver' : 'Reactiver'">Desactiver</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted small mt-4">
        L'ADMIN gere les acces au site mais ne participe pas aux decisions de recrutement :
        les validations sont reservees aux roles RH, FINANCE et DIRECTION.
    </p>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
